name: weather_olly
description: "A production-grade Flutter weather application with authentication, location, and forecast."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.7
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_dotenv: ^5.2.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
